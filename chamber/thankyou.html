<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You</title>
    <link rel="stylesheet" href="styles/join.css">
</head>

<body>
    <div class="thankyou-container">
        <h1 class="thankyou-title">Thank You for Your Submission!</h1>

        <div class="info-box">
            <p><strong>First Name:</strong> <span id="firstName"></span></p>
            <p><strong>Last Name:</strong> <span id="lastName"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>Mobile Phone:</strong> <span id="mobile"></span></p>
            <p><strong>Organization:</strong> <span id="organization"></span></p>
            <p><strong>Submitted:</strong> <span id="timestamp"></span></p>
        </div>
    </div>
    <script src="scripts/join.js"></script>
</body>
</html>
