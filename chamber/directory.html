<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Directory - La Paz Chamber of Commerce</title>
  <meta name="description" content="Member directory of the Chamber of Commerce. Search, filter, and switch between grid and list views.">
  <meta name="author" content="Emmanuel Jove">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Merriweather&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <!-- Favicon (inline SVG) -->
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <!-- Facebook / Open Graph Metadata -->
  <meta property="og:title" content="Chamber of Commerce - Directory">
  <meta property="og:description" content="Explore our local business directory.">
  <meta property="og:image" content="https://example.com/chamber/images/og-image.jpg">
  <meta property="og:url" content="https://example.com/chamber/directory.html">
  <meta property="og:type" content="website">

  <!-- Normalize -->
  <link rel="stylesheet" href="css/normalize.css">

  <!-- Main styles -->
  <link rel="stylesheet" href="styles/directory.css">
</head>

<body>
  <header class="site-header">
    <div class="wrap">
      <div class="logo-group">
        <img src="images/site-logo.svg" alt="Site Logo" width="70px">
        <a href="directory.html" class="logo">La Paz Chamber of Commerce</a>
      </div>
      <button id="menuToggle" class="menu-toggle" aria-expanded="false" aria-controls="mainNav">☰</button>

      <nav id="mainNav" class="main-nav" role="navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="directory.html">Directory</a></li>
          <li><a href="join.html">Join</a></li>
          <li><a href="discover.html">Discover</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap-content" role="main">
    <section class="controls">
      <div class="search-wrap">
        <label for="searchInput" class="sr-only">Search members</label>
        <input id="searchInput" type="search" placeholder="Search company, address, phone..." />
      </div>

      <div class="view-controls" role="toolbar" aria-label="View controls">
        <button id="gridBtn" class="active" aria-pressed="true" title="Grid View">Grid</button>
        <button id="listBtn" aria-pressed="false" title="List View">List</button>
        
        <label for="membershipFilter">Membership:</label>
        <select id="membershipFilter">
          <option value="all">All</option>
          <option value="1">Member</option>
          <option value="2">Silver</option>
          <option value="3">Gold</option>
        </select>
      </div>
    </section>

    <section id="membersContainer" class="members grid" aria-live="polite">
      <!-- Content dynamically inserted by JS -->
    </section>
  </main>

  <footer class="tcc-footer" role="contentinfo" aria-label="Footer">
    <div class="footer-wrap">
      <!-- Contact Column -->
      <section class="footer-col contact" aria-labelledby="contact-title">
        <h2 id="contact-title" class="footer-title">La Paz Chamber of Commerce</h2>
        <address class="footer-address">
          <div>13 Rivera Dr</div>
          <div>La Paz, Bolivia</div>
          <a href="mailto:info@lapazcc.org" class="footer-link">info@lapazcc.org</a>
          <a href="tel:+5915556200" class="footer-link">(591) 555-6200</a>
        </address>
      </section>

      <!-- Social -->
      <section class="footer-col social" aria-labelledby="social-title">
        <h2 id="social-title" class="footer-title">Follow us</h2>
        <nav class="social-list" aria-label="Social Media Links">
          <a class="social-item youtube" href="#" aria-label="YouTube" title="YouTube">
            <!-- YouTube SVG -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2c-.3-1.2-1.2-2.2-2.4-2.5C19 3.2 12 3.2 12 3.2s-7 0-9.1.5C1.7 4 0.8 5 0.5 6.2 0 8.3 0 12 0 12s0 3.7.5 5.8c.3 1.2 1.2 2.2 2.4 2.5C5 21.8 12 21.8 12 21.8s7 0 9.1-.5c1.2-.3 2.1-1.3 2.4-2.5.5-2.1.5-5.8.5-5.8s0-3.7-.5-5.8zM9.6 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg>
          </a>
          <a class="social-item twitter" href="#" aria-label="Twitter" title="Twitter">
            <!-- Twitter/X SVG -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.2 2H20l-6.6 7.6L21.8 22h-6.1l-4.8-6.5L5.3 22H2.5l7.2-8.3L2.2 2h6.2l4.3 5.9L17.2 2zm-1 18h2.1L8.7 4H6.6l9.6 16z"/></svg>
          </a>
          <a class="social-item linkedin" href="#" aria-label="LinkedIn" title="LinkedIn">
            <!-- LinkedIn SVG -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.98 3.5C4.98 4.88 3.86 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.5h4V23h-4V8.5zm7.5 0h3.8v2h.1c.5-1 1.8-2.1 3.7-2.1 3.9 0 4.6 2.6 4.6 6V23h-4v-5.1c0-1.2 0-2.8-1.7-2.8-1.7 0-2 1.3-2 2.7V23h-4V8.5z"/></svg>
          </a>
        </nav>
      </section>

      <!-- Project Column -->
      <section class="footer-col proyecto" aria-labelledby="proyecto-title">
        <ul class="project-meta">
          <li><span class="meta-label">WDD231 Class Project</span></li>
          <li><span class="meta-label">Emmanuel Jove</span></li>
          <li><span class="meta-label">&copy; <span id="currentyear"></span> • Emmanuel Jove • La Paz, Bolivia</span></li>
          <li><span class="meta-label" id="lastModified"></span></li>
        </ul>
      </section>
    </div>
  </footer>


  <script src="scripts/members.js" defer></script>
  <script src="scripts/date.js" defer></script>
</body>
</html>
